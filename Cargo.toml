[workspace]
members = [
    "programs/*"
]
resolver = "2"

[profile.release]
# Optimisation en taille : binaire ≈ 17 % plus petit (rente du programme), au prix d'unités de calcul en plus, loin de la
# limite par instruction.
opt-level = "s"
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

